<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Noun Generator</title>

<style>
    body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #f0f4ff, #dfe9ff);
        color: #222;
        display: flex;
        justify-content: center;
        padding: 40px;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 700px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 2rem;
        color: #2a4d9b;
    }

    label {
        font-weight: 600;
        margin-top: 15px;
        display: block;
    }

    select, input[type="number"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1rem;
    }

    .radio-group {
        margin-top: 10px;
    }

    .radio-group label {
        font-weight: normal;
        display: inline-block;
        margin-right: 15px;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        background: #2a4d9b;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #1d3570;
    }

    #results {
        margin-top: 30px;
        padding: 20px;
        background: #f7f9ff;
        border-radius: 12px;
        min-height: 80px;
        border: 1px solid #d0d8f0;
        font-size: 1.1rem;
        line-height: 1.6;
    }
/* Layout principale */
.layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
    margin-top: 20px;
}

/* Colonne laterali */
.side-ads {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 160px; /* larghezza fissa per evitare sovrapposizioni */
    ;
}

/* Box pubblicitari */
.ad-box {
    width: 100%;
    height: 300px;
    background: #e8e8e8;
    border: 2px dashed #bbb;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #666;
    font-size: 0.9rem;
}

/* Area centrale */
.main-area {
    flex-grow: 1;
    max-width: 700px;
}

/* Mobile: ads sotto il contenuto */
@media (max-width: 900px) {
    .layout {
        flex-direction: column;
        align-items: center;
    }

    .side-ads {
        width: 100%;
        flex-direction: row;
        justify-content: center;
    }

    .ad-box {
        height: 120px;
    }
}

</style>
</head>

<body>
<div class="layout">
<div class="layout">

    <!-- LEFT SIDE ADS -->
    <div class="side-ads left-side">
        <div class="ad-box">Left Ad 1</div>
        <div class="ad-box">Left Ad 2</div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-area">
        <div class="container">

    <h1>Random Noun Generator</h1>

    <!-- CATEGORY SELECTION -->
    <label for="category">Category</label>
    <select id="category">
        <option value="all">All</option>
        <option value="food">Food</option>
        <option value="clothes">Clothes</option>
        <option value="objects">Objects</option>
        <option value="materials">Materials</option>
        <option value="electronics">Electronics</option>
        <option value="location">Location</option>
        <option value="abstract">Abstract</option>
        <option value="body">Body</option>
    </select>

    <!-- QUANTITY -->
    <label for="quantity">How many words? (1–1000)</label>
    <input type="number" id="quantity" min="1" max="1000" value="1">

    <!-- ORDERING -->
    <label>Ordering</label>
    <div class="radio-group">
        <label><input type="radio" name="order" value="random" checked> Random</label>
        <label><input type="radio" name="order" value="az"> A → Z</label>
        <label><input type="radio" name="order" value="za"> Z → A</label>
    </div>

    <!-- GENERATE BUTTON -->
    <button onclick="generateWords()">Generate</button>

    <!-- RESULTS -->
    <div id="results">Your generated words will appear here.</div>

</div>
    </div>

    <!-- RIGHT SIDE ADS -->
    <div class="side-ads right-side">
        <div class="ad-box">Right Ad 1</div>
        <div class="ad-box">Right Ad 2</div>
    </div>

</div>

<script>
let dictionary = [];

// Load dick.json
async function loadDictionary() {
    try {
        const res = await fetch("dick.json");
        dictionary = await res.json();
    } catch (err) {
        console.error("Error loading dick.json", err);
    }
}
loadDictionary();

function generateWords() {
    if (!dictionary.length) {
        document.getElementById("results").innerHTML = "Dictionary not loaded.";
        return;
    }

    const category = document.getElementById("category").value;
    const quantity = parseInt(document.getElementById("quantity").value);
    const order = document.querySelector('input[name="order"]:checked').value;

    let filtered = dictionary.filter(entry => {
    const cats = Array.isArray(entry.category)
        ? entry.category
        : [entry.category];

    if (category === "all") return true;

    return cats.includes(category);
    });


    // Shuffle if random
    if (order === "random") {
        filtered = filtered.sort(() => Math.random() - 0.5);
    } else if (order === "az") {
        filtered = filtered.sort((a, b) => a.word.localeCompare(b.word));
    } else if (order === "za") {
        filtered = filtered.sort((a, b) => b.word.localeCompare(a.word));
    }

    // Limit quantity
    const selected = filtered.slice(0, quantity);

    // Display
    document.getElementById("results").innerHTML =
        selected.map(w => w.word).join(", ");
}
</script>

</body>
</html>
